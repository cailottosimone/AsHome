<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista Spesa Smart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://kit.fontawesome.com/75d8a5f1bd.js" crossorigin="anonymous"></script>
  <style>
    /* FIX ZOOM IPHONE: forza 16px sugli input per evitare lo zoom automatico */
    input, select { font-size: 16px !important; }
    
    /* Layout pulsanti fluttuanti */
    .fab-container { position: fixed; bottom: 2rem; right: 1.5rem; display: flex; flex-direction: column; gap: 1rem; z-index: 50; }
    .fab-btn { width: 3.5rem; height: 3.5rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); transition: transform 0.2s; }
    .fab-btn:active { transform: scale(0.9); }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen pb-24">

  <!-- Header -->
  <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-20">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <i class="fa-solid fa-cart-shopping"></i> AsHome
      </h1>
      <button onclick="openHistoryModal()" class="text-white p-2 hover:bg-indigo-700 rounded-full transition">
        <i class="fa-solid fa-clock-rotate-left text-lg"></i>
      </button>
    </div>
  </header>

  <!-- Pulsanti Fluttuanti (FAB) -->
  <div class="fab-container">
    <button onclick="finishShopping()" class="fab-btn bg-emerald-500 text-white" title="Spesa Finita">
      <i class="fa-solid fa-check text-xl"></i>
    </button>
    <button onclick="openModal()" class="fab-btn bg-indigo-600 text-white" title="Aggiungi">
      <i class="fa-solid fa-plus text-2xl"></i>
    </button>
  </div>

  <main class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- Filtri Ingranditi -->
    <section>
      <div id="shopFilters" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none"></div>
    </section>

    <div id="loading" class="text-center py-10 text-slate-400">Caricamento...</div>
    <div id="listContainer" class="space-y-4 hidden"></div>
    <div id="emptyState" class="text-center py-12 hidden text-slate-400">
      <i class="fa-solid fa-basket-shopping text-4xl mb-3"></i>
      <p>Lista vuota.</p>
    </div>
  </main>

  <!-- MODAL: Aggiungi/Modifica -->
  <div id="modal" class="fixed inset-0 bg-black/50 z-50 hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-6 space-y-4 shadow-2xl">
      <h3 id="modalTitle" class="font-bold text-lg border-b pb-3">Nuovo Prodotto</h3>
      <form id="addForm" onsubmit="handleAdd(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold mb-1">Prodotto *</label>
          <input type="text" id="inputProdotto" required class="w-full border rounded-xl p-3 bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-semibold mb-1">Quantità</label>
            <input type="text" id="inputQuantita" class="w-full border rounded-xl p-3 bg-slate-50 outline-none">
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">Categoria</label>
            <select id="inputCategoria" class="w-full border rounded-xl p-3 bg-slate-50 outline-none">
              <option value="Frutta e Verdura">🥦 Frutta e Verdura</option>
              <option value="Carne e Pesce">🥩 Carne e Pesce</option>
              <option value="Latticini e Uova">🧀 Latticini e Uova</option>
              <option value="Altro" selected>📦 Altro</option>
            </select>
          </div>
        </div>
        <div class="pt-3 flex gap-3">
          <button type="button" onclick="closeModal()" class="w-1/2 bg-slate-100 py-3 rounded-xl font-bold">Annulla</button>
          <button type="submit" id="btnSubmit" class="w-1/2 bg-indigo-600 text-white py-3 rounded-xl font-bold">Salva</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: Storico -->
  <div id="historyModal" class="fixed inset-0 bg-black/50 z-50 hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 shadow-2xl max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-lg">Storico Acquisti</h3>
        <button onclick="closeHistoryModal()" class="p-2 text-slate-400"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div id="historyListContainer" class="flex-1 overflow-y-auto space-y-3"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://xnkkacszdmrigudkwcio.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_z16j13lRrbWvtAISvx4ssQ_zqNBEckf";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { db: { schema: 'AsHome' } });

    let allItems = [], activeItems = [], archivedItems = [], currentShop = "Tutti", editingItemId = null;

    document.addEventListener("DOMContentLoaded", () => { fetchItems(); subscribeRealtime(); });

    async function fetchItems() {
      const { data } = await db.from('lista_spesa').select('*').order('created_at', { ascending: false });
      if (data) {
        allItems = data;
        activeItems = allItems.filter(i => !i.archiviato);
        archivedItems = allItems.filter(i => i.archiviato);
        renderFilters(); renderList(); renderHistory();
        document.getElementById("loading").classList.add("hidden");
      }
    }

    function renderFilters() {
      const shops = ["Tutti", ...new Set(activeItems.map(i => i.negozio).filter(Boolean))];
      document.getElementById("shopFilters").innerHTML = shops.map(shop => `
        <button onclick="setShop('${shop}')" class="px-5 py-2.5 rounded-full font-bold text-sm whitespace-nowrap transition ${currentShop === shop ? 'bg-indigo-600 text-white' : 'bg-white border text-slate-600'}">
          ${shop}
        </button>
      `).join("");
    }

    function setShop(shop) { currentShop = shop; renderFilters(); renderList(); }

    function renderList() {
      const filtered = activeItems.filter(i => currentShop === "Tutti" || i.negozio === currentShop);
      const container = document.getElementById("listContainer");
      if (filtered.length === 0) { container.classList.add("hidden"); document.getElementById("emptyState").classList.remove("hidden"); return; }
      document.getElementById("emptyState").classList.add("hidden"); container.classList.remove("hidden");

      container.innerHTML = filtered.map(item => `
        <div class="bg-white p-4 rounded-2xl shadow-sm border flex items-center justify-between ${item.acquistato ? 'opacity-50' : ''}">
          <div class="flex items-center gap-3 cursor-pointer" onclick="toggleItem('${item.id}', ${item.acquistato})">
            <input type="checkbox" ${item.acquistato ? 'checked' : ''} class="w-6 h-6">
            <div>
              <div class="font-bold text-lg ${item.acquistato ? 'line-through' : ''}">${item.prodotto}</div>
              <div class="text-xs text-slate-500">${item.categoria} ${item.quantita ? '• ' + item.quantita : ''}</div>
            </div>
          </div>
          <button onclick="deleteItem('${item.id}', event)" class="text-slate-300 p-2"><i class="fa-solid fa-trash text-lg"></i></button>
        </div>
      `).join("");
    }

    async function finishShopping() {
      const completed = activeItems.filter(i => i.acquistato);
      if (completed.length === 0) { alert("Spunta prima gli articoli!"); return; }
      if (!confirm(`Archiviare ${completed.length} articoli?`)) return;
      
      const now = new Date().toISOString();
      await db.from('lista_spesa').update({ archiviato: true, data_archiviazione: now }).in('id', completed.map(i => i.id));
      fetchItems();
    }

    function renderHistory() {
      document.getElementById("historyListContainer").innerHTML = archivedItems.map(item => `
        <div class="p-3 border-b text-sm flex justify-between items-center">
          <div>
            <div class="font-bold line-through">${item.prodotto}</div>
            <div class="text-[10px] text-slate-400">${new Date(item.data_archiviazione).toLocaleDateString()}</div>
          </div>
          <button onclick="restoreItem('${item.id}')" class="text-indigo-600 font-bold px-3 py-1 bg-indigo-50 rounded-lg">Ripristina</button>
        </div>
      `).join("");
    }

    async function restoreItem(id) { await db.from('lista_spesa').update({ archiviato: false, acquistato: false }).eq('id', id); fetchItems(); }

    async function toggleItem(id, state) { await db.from('lista_spesa').update({ acquistato: !state }).eq('id', id); fetchItems(); }
    async function deleteItem(id, e) { e.stopPropagation(); await db.from('lista_spesa').delete().eq('id', id); fetchItems(); }
    async function handleAdd(e) { e.preventDefault(); /* ...stessa logica precedente... */ await db.from('lista_spesa').insert([{ prodotto: document.getElementById("inputProdotto").value, categoria: document.getElementById("inputCategoria").value, acquistato: false, archiviato: false }]); closeModal(); fetchItems(); }
    
    function openModal() { document.getElementById("modal").classList.remove("hidden"); }
    function closeModal() { document.getElementById("modal").classList.add("hidden"); }
    function openHistoryModal() { document.getElementById("historyModal").classList.remove("hidden"); }
    function closeHistoryModal() { document.getElementById("historyModal").classList.add("hidden"); }
    function subscribeRealtime() { db.channel('ashome:lista_spesa').on('postgres_changes', { event: '*', schema: 'AsHome', table: 'lista_spesa' }, () => fetchItems()).subscribe(); }
  </script>
</body>
</html>
